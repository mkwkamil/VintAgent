services:
  vintagent:
    build: .
    image: vintagent:latest
    container_name: vintagent
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # Nadpisuje lokalne ścieżki z .env — w kontenerze zawsze /app/data
      DATA_FILE: /app/data/data.json
      SESSION_FILE: /app/data/session.json
      BROWSER_PROFILE_DIR: /app/data/chrome_cdp
      CHROME_CDP_URL: http://127.0.0.1:9222
      CHROME_DOCKER: "1"
      CHROME_MANAGED_BY_ENTRYPOINT: "1"
      DISPLAY: ":99"
      BROWSER_BOOTSTRAP_ENABLED: "true"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 900m
    cpus: 1.0
